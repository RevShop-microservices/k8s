  cart-service.properties: |
    spring.data.mongodb.uri=${MONGO_URI:mongodb+srv://JananiSivasankar:Janani2407@cluster0.rqcvycq.mongodb.net/ecommerceDB?retryWrites=true&w=majority&appName=Cluster0}
    logging.level.com.example.cart_service=DEBUG

  AI-service.properties: |
    spring.data.mongodb.uri=${MONGO_URI:mongodb+srv://JananiSivasankar:Janani2407@cluster0.rqcvycq.mongodb.net/ecommerceDB?retryWrites=true&w=majority&appName=Cluster0}
    spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/EcommerceDB}
    spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
    spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true

    ollama.base-url=${OLLAMA_URL:http://localhost:11434}
    ollama.model=${OLLAMA_MODEL:phi3:mini}
    ollama.embed-model=${OLLAMA_EMBED_MODEL:nomic-embed-text}

    logging.level.com.example.orderservice=DEBUG

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: harish1023/microservices-project-config-server:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: EUREKA_SERVER_URL
              value: "http://eureka-server:8761/eureka/"
            - name: SPRING_PROFILES_ACTIVE
              value: native
          volumeMounts:
            - name: config-repo-volume
              mountPath: /config-repo
      volumes:
        - name: config-repo-volume
          configMap:
            name: config-repo-configmap

---
apiVersion: v1
kind: Service
metadata:
  name: config-server
spec:
  ports:
    - port: 8888
      targetPort: 8888
  selector:
    app: config-server
