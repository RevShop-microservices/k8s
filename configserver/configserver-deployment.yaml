    spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

    razorpay.key=${RAZORPAY_KEY:rzp_test_xxxxxxxxx}
    razorpay.secret=${RAZORPAY_SECRET:xxxxxxxxxxxxxxxxxx}

